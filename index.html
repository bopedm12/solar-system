<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="NASA 3D Solar System — Mô phỏng Hệ Mặt Trời 3D chuẩn dữ liệu NASA NSSDCA, tối ưu hóa 120 FPS với Custom GLSL Shaders & InstancedMesh" />
  <meta name="theme-color" content="#030712" />
  <title>Solar System — Designed by qipi</title>

  <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #02040a;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #solar-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    #hud-root {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
    }

    /* Boot Loader Overlay (Liquid Glass Style) */
    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #070d1e 0%, #010206 85%);
      transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.65s;
    }

    #boot-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 34px 44px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.04) 50%,
        rgba(130, 185, 255, 0.08) 100%
      );
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 24px 50px -10px rgba(0, 0, 0, 0.75),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.5),
        inset 0 -1px 2px 0 rgba(120, 180, 255, 0.18);
      border-radius: 26px;
      color: #ffffff;
      text-align: center;
      max-width: 90vw;
    }

    .boot-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.45), 0 0 45px rgba(56, 189, 248, 0.35);
      margin-bottom: 0.65rem;
    }

    .boot-sub {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: #cbd5e1;
      margin-bottom: 1.6rem;
    }

    .boot-bar-track {
      width: 240px;
      height: 3px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .boot-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #ffffff, #818cf8);
      transform-origin: left center;
      animation: pulseLoad 1.2s ease-in-out infinite;
    }

    @keyframes pulseLoad {
      0% { transform: scaleX(0.12); opacity: 0.55; }
      50% { transform: scaleX(0.96); opacity: 1; }
      100% { transform: scaleX(0.12); opacity: 0.55; }
    }
  </style>
</head>
<body>
  <div id="boot-loader" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-logo">SOLAR SYSTEM</div>
      <div class="boot-sub">Website designed and created by qipi</div>
      <div class="boot-bar-track">
        <div class="boot-bar-fill"></div>
      </div>
    </div>
  </div>

  <div id="app">
    <canvas id="solar-canvas" aria-label="Mô phỏng 3D Hệ Mặt Trời chuẩn NASA"></canvas>
    <div id="hud-root"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
